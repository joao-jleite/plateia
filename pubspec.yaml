name: watchlog
description: "Plateia (codinome): o que você assiste em todos os streamings, onde cada título está no Brasil e uma rede social em volta."
# Pacote privado: nunca publicar no pub.dev.
publish_to: "none"

# versionCode = o número depois do "+": sobe 1 a cada upload na Play (nunca repete).
# versionName é o que a pessoa vê. Fase 08 = primeiro candidato a release.
version: 1.0.0+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Sem isto o Material desenha os próprios textos em inglês (seletor de data, "Cancel"…).
  flutter_localizations:
    sdk: flutter

  # Backend: Auth, PostgREST, Storage e functions.invoke (docs/ARQUITETURA.md §8)
  supabase_flutter: ^2.18.3
  # Estado: Riverpod 3 com codegen (§5)
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  # Navegação (§6)
  go_router: ^18.1.1
  # Modelos imutáveis + fromJson das linhas do PostgREST (§7)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  # Login Google pelo fluxo nativo → auth.signInWithIdToken
  google_sign_in: ^7.2.0
  # Abrir o app do streaming: URL em modo externo e, para o Disney+, o pacote
  url_launcher: ^6.3.3
  android_intent_plus: ^6.1.0
  # Pôsteres do TMDB com cache em disco
  cached_network_image: ^4.0.3
  # Datas em pt-BR
  intl: ^0.20.2
  http: ^1.6.0
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  crypto: ^3.0.7
  # Compartilhar o link do perfil (/u/:username) pela folha nativa do Android
  share_plus: ^13.3.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.6
  skeletonizer: ^3.0.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9
  # 4.0.0-dev.3 é a única versão do freezed compatível com o analyzer do Dart 3.12
  # (a 3.2.x para no analyzer 10). Ver "Decisões" no CLAUDE.md.
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    # Marca (ícone, splash, login): gerada por tool/branding/render_branding_test.dart
    - assets/branding/plateia_mark.svg
    # Logo oficial do TMDB (atribuição). A pasta fica no git vazia; quando o João
    # salvar `assets/tmdb/logo.svg` nela, a tela Sobre e Onde assistir passam a
    # mostrar o logo em vez do selo de texto (docs/PENDENCIAS-JOAO.md).
    - assets/tmdb/

# Ícone adaptativo do Android (fase 08). Regenerar: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon_legacy.png
  adaptive_icon_background: "#0E0D12"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_foreground.png
  min_sdk_android: 24

# Splash nativo (fase 08). Regenerar: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0E0D12"
  image: assets/branding/splash_mark.png
  android_12:
    color: "#0E0D12"
    image: assets/branding/splash_android12.png
  android: true
  ios: false
  web: false
